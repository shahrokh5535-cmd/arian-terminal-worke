name: R2 archive safety (no production access)

on:
  pull_request:
    paths:
      - 'db/r2_archive_preflight.sql'
      - 'docs/R2_ARCHIVE_RUNBOOK.md'
      - 'test/r2-archive-preflight.test.js'
      - '.github/workflows/r2-archive-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert archive diagnostic SQL and safety gates
        run: node --test test/r2-archive-preflight.test.js
